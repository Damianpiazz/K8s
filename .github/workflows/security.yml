# ─── Security: scheduled scans, dependency review on PRs ───
name: Security

on:
  schedule:
    # Weekly scan — Monday 06:00 UTC
    - cron: "0 6 * * 1"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ── Secret scanning (Gitleaks) ──
  secret-scan:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    # Fail-closed on main/scheduled runs; lenient on PRs
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Trivy filesystem scan ──
  trivy-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    # Fail-closed on main/scheduled runs; lenient on PRs
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  # ── Trivy SBOM generation and upload ──
  trivy-sbom:
    name: Trivy SBOM
    runs-on: ubuntu-latest
    # Fail-closed on main/scheduled runs; lenient on PRs
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: sbom.sarif

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sbom-${{ github.sha }}
          path: sbom.sarif
          retention-days: 90

  # ── Dependency review (PRs only) ──
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
