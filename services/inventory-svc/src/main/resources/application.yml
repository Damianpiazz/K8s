# ── Inventory service ───────────────────────────────────────────────────────
server:
  port: 8093

spring:
  application:
    name: inventory-svc

  config:
    # Optional config-server import: when config-service is up, inventory-svc.yml
    # (and its `demo` profile block) load from it; when absent the app boots
    # with the local defaults below. Set CONFIG_SERVER_URL in k8s.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  datasource:
    # Demo default: in-memory H2 (matches config-service inventory-svc.yml demo
    # block). Production override via k8s ConfigMap — point at Azure Postgres:
    # jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    url: jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop   # fine for demo; use `validate` + migrations with Postgres
    open-in-view: false
    defer-datasource-initialization: true

# Same keys as config-service inventory-svc.yml — local defaults when the
# config server is absent.
inventory:
  reservation-ttl-minutes: 15

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      # Overridden in k8s via EUREKA_SERVER_URL env.
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true