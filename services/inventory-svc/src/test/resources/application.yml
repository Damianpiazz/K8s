# Test profile: no Eureka, no external config server, plain H2.
eureka:
  client:
    enabled: false

spring:
  cloud:
    config:
      import-check:
        enabled: false
  datasource:
    url: jdbc:h2:mem:inventorytest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false