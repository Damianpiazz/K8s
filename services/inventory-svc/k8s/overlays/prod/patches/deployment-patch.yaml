apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-svc
spec:
  # ⚠️ scaling out with the in-memory reservation map + per-pod H2 splits
  # reservations across pods. Move to Postgres row-locked reservations first
  # (see README).
  replicas: 2
  template:
    spec:
      containers:
        - name: inventory-svc
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi