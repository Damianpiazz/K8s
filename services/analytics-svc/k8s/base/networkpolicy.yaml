apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-svc
  labels:
    app: analytics-svc
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  podSelector:
    matchLabels:
      app: analytics-svc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the api-gateway may call the analytics API (ingest + reports).
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
    # Prometheus scraping (/actuator/prometheus) from the observability ns.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
  egress:
    # DNS resolution (CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # config-service (:8888), discovery-service (:8761), platform peers.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecommerce
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce-platform
    # Key Vault / kube-apiserver (443) + Event Hubs (9093) for the production
    # stream integration.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 9093
          protocol: TCP