apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-svc
  labels:
    app: analytics-svc
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-svc
  template:
    metadata:
      labels:
        app: analytics-svc
        env: production
        app.kubernetes.io/part-of: ecommerce-platform
    spec:
      serviceAccountName: analytics-svc
      containers:
        - name: analytics-svc
          image: acr.azurecr.io/analytics-svc:latest
          ports:
            - name: http
              containerPort: 8096
          env:
            - name: EUREKA_SERVER_URL
              value: http://discovery-service:8761/eureka/
            - name: CONFIG_SERVER_URL
              value: http://config-service:8888
            - name: LOG_LEVEL
              value: INFO
          envFrom:
            # Per-environment hints (LOG_LEVEL, ENVIRONMENT).
            - configMapRef:
                name: ecommerce-env-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          # Spring writes /tmp (embedded Tomcat) — keep the fs writable.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL