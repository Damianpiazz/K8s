apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: analytics-svc
  labels:
    app: analytics-svc
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  # NOTE: the event buffer and counters are per-pod; report endpoints reflect
  # only what the local pod ingested.
  minAvailable: 1
  selector:
    matchLabels:
      app: analytics-svc