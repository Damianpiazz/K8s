# ── Returns service ─────────────────────────────────────────────────────────
server:
  port: 8095

spring:
  application:
    name: returns-svc

  config:
    # Optional config-server import: when config-service is up, returns-svc.yml
    # (and its `demo` profile block) load from it; when absent the app boots
    # with the local defaults below. Set CONFIG_SERVER_URL in k8s.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Same keys as config-service returns-svc.yml — local defaults when the config
# server is absent. Auto-approval rule (visible, documented): the reason must be
# in the allow-list, the request must arrive within the return window, and the
# quantity must not exceed the auto-approve cap; otherwise PENDING_REVIEW.
returns:
  auto-approvable-reasons: defective,wrong-item,not-as-described
  return-window-days: 30
  max-quantity-auto-approve: 10

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      # Overridden in k8s via EUREKA_SERVER_URL env.
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true