apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: returns-svc
  labels:
    app: returns-svc
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  # NOTE: with the in-memory store, replicas do NOT share RMAs. Use a
  # database-backed store before scaling out (see README).
  minAvailable: 1
  selector:
    matchLabels:
      app: returns-svc