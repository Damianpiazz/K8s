apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay — thin: replica counts + resources + ACR image name.
resources:
  - ../../base

patches:
  - path: patches/deployment-patch.yaml
    target:
      kind: Deployment
      name: config-service
  - path: patches/hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: config-service

# CD (git push to main) rewrites newTag to the commit SHA. Replace `acr` with
# your real ACR login server ONCE (e.g. myacr.azurecr.io/config-service) —
# the workflow matches this exact newName.
images:
  - name: acr.azurecr.io/config-service
    newName: acr.azurecr.io/config-service
    newTag: latest