apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  labels:
    app: config-service
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
        env: production
        app.kubernetes.io/part-of: ecommerce-platform
    spec:
      serviceAccountName: config-service
      # Kyverno require-labels expects `app` + `env`; kyverno disallow-latest
      # means the placeholder :latest tag below is always overridden by the
      # overlay's images[].newTag (CD sets it to the commit SHA).
      containers:
        - name: config-service
          image: acr.azurecr.io/config-service:latest
          ports:
            - name: http
              containerPort: 8888
          env:
            # Native profile + classpath backend — matches application.yml defaults,
            # kept explicit here so the deployed pod never depends on image defaults.
            - name: SPRING_PROFILES_ACTIVE
              value: native
            - name: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS
              value: classpath:/config
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          # Spring writes /tmp (embedded Tomcat, JFR) — keep the fs writable.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL