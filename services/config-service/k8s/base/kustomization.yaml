apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests for the config-service — environment-agnostic.
# Namespace transformer: everything lands in `ecommerce`.
namespace: ecommerce

labels:
  - pairs:
      app.kubernetes.io/part-of: ecommerce-platform

resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - serviceaccount.yaml
  - networkpolicy.yaml

# Image the base manifests reference. The overlay redeclares this with the
# real ACR name and lets the CD workflow set newTag to the commit SHA.
images:
  - name: acr.azurecr.io/config-service
    newName: acr.azurecr.io/config-service
    newTag: latest