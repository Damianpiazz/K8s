apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: discovery-service
  labels:
    app: discovery-service
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  podSelector:
    matchLabels:
      app: discovery-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Every service in the platform registers + heartbeats with Eureka.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce-platform
    # Prometheus scraping (/actuator/prometheus) from the observability ns.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
  egress:
    # DNS resolution (CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Peer replication between Eureka replicas (HA) + other platform traffic.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecommerce
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce-platform
    # Azure services + kube-apiserver (443).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP