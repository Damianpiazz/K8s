apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay — thin: replica counts + resources + ACR image name.
resources:
  - ../../base

patches:
  - path: patches/deployment-patch.yaml
    target:
      kind: Deployment
      name: recommendation-svc
  - path: patches/hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: recommendation-svc

# CD (git push to main) rewrites newTag to the commit SHA. Replace `acr` with
# your real ACR login server ONCE.
images:
  - name: acr.azurecr.io/recommendation-svc
    newName: acr.azurecr.io/recommendation-svc
    newTag: latest