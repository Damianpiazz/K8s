apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-svc
  labels:
    app: notification-svc
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-svc
  template:
    metadata:
      labels:
        app: notification-svc
        env: production
        app.kubernetes.io/part-of: ecommerce-platform
    spec:
      serviceAccountName: notification-svc
      containers:
        - name: notification-svc
          image: acr.azurecr.io/notification-svc:latest
          ports:
            - name: http
              containerPort: 8086
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0
          envFrom:
            # Service defaults (Kafka consumer switch, bootstrap, config URLs).
            # Listed FIRST so ecommerce-env-config below wins on KAFKA_BOOTSTRAP.
            - configMapRef:
                name: notification-svc-config
            # Per-environment overrides: KAFKA_BOOTSTRAP (Event Hubs SASL_SSL),
            # KAFKA_SECURITY_PROTOCOL, LOG_LEVEL…
            - configMapRef:
                name: ecommerce-env-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          # Spring writes /tmp (embedded Tomcat) — keep the fs writable.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL