apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-svc-config
  labels:
    app: payment-svc
    app.kubernetes.io/part-of: ecommerce-platform
data:
  # ── Datasource ────────────────────────────────────────────────────────
  # Fase 6: el datasource NO vive en el base (era jdbc:h2 en memoria). Cada
  # overlay lo inyecta via env del deployment (nunca H2 en config de cluster):
  #   - local:      patches/payment-svc-postgres-sidecar.yaml → Postgres
  #                 sidecar en el pod (postgres:16-alpine, 127.0.0.1:5432)
  #   - dev/staging/prod: patches/payment-svc-datasource.yaml → Azure
  #                 Database for PostgreSQL gestionado (${DB_HOST}:${DB_PORT})
  # Credenciales: Secret `db-credentials` (ExternalSecret → Key Vault en
  # Azure; Secret placeholder en local). Fallback sin overlay: application.yml
  # (H2 demo). Keys que cada overlay provee:
  #   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_DRIVER_CLASS_NAME /
  #   SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD /
  #   SPRING_JPA_HIBERNATE_DDL_AUTO
  # NOTA: el store de PaymentService sigue siendo el HashMap en memoria (sin
  # JPA aún, fix 30) — el datasource ya apunta a Postgres; la persistencia
  # real llega con la implementación JPA (pendiente, no es config).
  SPRING_JPA_OPEN_IN_VIEW: "false"

  # Config server + Eureka endpoints (DNS names within the ecommerce ns).
  CONFIG_SERVER_URL: http://config-service:8888
  EUREKA_SERVER_URL: http://discovery-service:8761/eureka/