apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-svc-config
  labels:
    app: payment-svc
    app.kubernetes.io/part-of: ecommerce-platform
data:
  # ── Datasource defaults (demo: in-memory H2) ──────────────────────────
  # The deployment consumes this via envFrom, so Spring Boot picks these
  # up as relaxed-binder env vars (SPRING_DATASOURCE_URL etc.). Keys match
  # config-service config/payment-svc.yml (demo block).
  #
  # ── Switch to Azure managed Postgres: ─────────────────────────────────
  # DB_HOST / DB_PORT / DB_NAME come from the ecommerce-env-config ConfigMap
  # (applied by cluster/overlays/{env}). Override here and swap the in-memory
  # PaymentService for its JPA repository implementation:
  #   SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
  #   SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  #   SPRING_DATASOURCE_USERNAME: <db-user>
  #   SPRING_DATASOURCE_PASSWORD: <from Azure Key Vault / external-secrets>
  #   SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_DATASOURCE_URL: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
  SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
  SPRING_JPA_OPEN_IN_VIEW: "false"

  # Config server + Eureka endpoints (DNS names within the ecommerce ns).
  CONFIG_SERVER_URL: http://config-service:8888
  EUREKA_SERVER_URL: http://discovery-service:8761/eureka/