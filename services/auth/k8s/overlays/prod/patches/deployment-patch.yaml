apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
# Keycloak in prod posture (fix 30) is switched at the cluster-overlay level
  # (cluster/overlays/prod/patches/auth-keycloak-start.yaml): kc.sh start +
  # managed Postgres + proxy headers. HA with `start` still needs the embedded
  # cache replaced (--cache-stack=kubernetes, JGroups) — pending; keep replicas
  # at 2 unless that lands (then 3 + Postgres, already provisioned).
  replicas: 2
  template:
    spec:
      containers:
        - name: auth
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: 1500m
              memory: 1536Mi