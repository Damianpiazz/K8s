apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth
  annotations:
    # Let's Encrypt certs via cert-manager. The letsencrypt-default ClusterIssuer
    # is layered per environment: cluster/overlays/{dev,staging,prod}/issuer-default.yaml
    cert-manager.io/cluster-issuer: letsencrypt-default
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Underlying service is HTTP-only; TLS terminates at the ingress.
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
  labels:
    app: auth
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  # External entrypoint for the Keycloak token/authorize endpoints and realm
  # redirects (api-gateway is not the only ingress on the platform). Replace
  # auth.<domain> with your DNS zone (external-dns picks the hostname up and
  # creates the A record).
  ingressClassName: nginx
  rules:
    - host: auth.<domain>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  name: http
  tls:
    - hosts:
        - auth.<domain>
      secretName: auth-tls