apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests for the auth service (Keycloak) — environment-agnostic.
namespace: ecommerce

labels:
  - pairs:
      app.kubernetes.io/part-of: ecommerce-platform

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - admin-credentials.yaml   # placeholder Secret — gitignored (**/admin-credentials.yaml); real source: Azure Key Vault via external-secret.yaml
  - external-secret.yaml
  - hpa.yaml
  - pdb.yaml
  - serviceaccount.yaml
  - networkpolicy.yaml

images:
  - name: acr.azurecr.io/auth
    newName: acr.azurecr.io/auth
    newTag: latest