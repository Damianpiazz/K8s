apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        app.kubernetes.io/part-of: ecommerce-platform
    spec:
      serviceAccountName: auth
      containers:
        - name: auth
          image: acr.azurecr.io/auth:latest
          # start-dev --import-realm replica el ENTRYPOINT de la imagen;
          # --health-enabled=true hace que los probes /health/* respondan y
          # --metrics-enabled=true expone /metrics en el puerto HTTP principal
          # (8080). Keycloak <= 24 sirve health + metrics en el puerto main;
          # si la imagen sube a Keycloak 25+, /metrics y /health migran al
          # puerto de management (9000) y el ServiceMonitor + los probes deben
          # migrar juntos.
          command: ["/opt/keycloak/bin/kc.sh"]
          args: ["start-dev", "--import-realm", "--health-enabled=true", "--metrics-enabled=true"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # Admin console bootstrap (start-dev). Values come from the
            # placeholder Secret — replace it with the external-secrets flow.
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: password
            # Keycloak logs go to stdout; filter level via env.
            - name: KC_LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          # The Keycloak image already runs as uid 1000 (keycloak user).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Keycloak writes to /opt/keycloak/data + /tmp
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL