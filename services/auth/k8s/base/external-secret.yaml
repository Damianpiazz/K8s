# Example ExternalSecret — production path for the Keycloak admin credentials.
#
# Reads `keycloak-admin-password` from Azure Key Vault and materialises a Secret
# named `keycloak-admin-credentials` (overwriting the placeholder from secret.yaml).
# Requires the ClusterSecretStore `azure-keyvault` from cluster/base and a vault
# secret named `keycloak-admin-password` (see cluster/base/external-secrets/).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin-credentials
  labels:
    app: auth
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: keycloak-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: keycloak-admin-username
    - secretKey: password
      remoteRef:
        key: keycloak-admin-password