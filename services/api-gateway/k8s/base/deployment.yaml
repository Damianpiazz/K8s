apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        env: production
        app.kubernetes.io/part-of: ecommerce-platform
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: api-gateway
          image: acr.azurecr.io/api-gateway:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: EUREKA_SERVER_URL
              value: http://discovery-service:8761/eureka/
            - name: CONFIG_SERVER_URL
              value: http://config-service:8888
            - name: LOG_LEVEL
              value: INFO
          envFrom:
            # LOG_LEVEL / ENVIRONMENT etc. come from the ecommerce-env-config
            # ConfigMap applied by cluster/overlays/{dev,staging,prod}.
            - configMapRef:
                name: ecommerce-env-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          # Spring writes /tmp (embedded Netty, JFR) — keep the fs writable.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL