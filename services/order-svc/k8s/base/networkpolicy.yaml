apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-svc
  labels:
    app: order-svc
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  podSelector:
    matchLabels:
      app: order-svc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the api-gateway (and checkout-svc in a future phase) call the order API.
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
    # Prometheus scraping (/actuator/prometheus) from the observability ns.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
  egress:
    # DNS resolution (CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # config-service (:8888), discovery-service (:8761), platform peers.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecommerce
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce-platform
    # Azure managed Postgres (5432) + Key Vault / kube-apiserver (443).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP