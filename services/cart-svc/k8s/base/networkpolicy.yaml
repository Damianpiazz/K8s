apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cart-svc
  labels:
    app: cart-svc
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  podSelector:
    matchLabels:
      app: cart-svc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the api-gateway may call the cart API.
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
    # Prometheus scraping (/actuator/prometheus) from the observability ns.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
  egress:
    # DNS resolution (CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # config/discovery + future peers (Redis in data/ ns, order-svc…).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecommerce
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce-platform
    # Azure managed Redis (6380) + Key Vault / kube-apiserver (443).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 6380
          protocol: TCP