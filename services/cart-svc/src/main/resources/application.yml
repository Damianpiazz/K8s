# ── Shopping cart service ──────────────────────────────────────────────────
server:
  port: 8082

spring:
  application:
    name: cart-svc

  config:
    # Optional config-server import (cart-svc.yml from config-service).
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      # Overridden in k8s via EUREKA_SERVER_URL env.
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true