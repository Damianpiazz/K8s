# ── Search service ─────────────────────────────────────────────────────────
server:
  port: 8091

spring:
  application:
    name: search-svc

  config:
    # Optional config-server import: when config-service is up, search-svc.yml
    # (and its `demo` profile block) load from it; when absent the app boots
    # with the local defaults below. Set CONFIG_SERVER_URL in k8s.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Same keys as config-service search-svc.yml — local defaults when the config
# server is absent.
search:
  max-results: 10
  hot-limit: 5

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      # Overridden in k8s via EUREKA_SERVER_URL env.
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true