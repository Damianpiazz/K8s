# ── BFF for the web storefront ─────────────────────────────────────────────
server:
  port: 8090

spring:
  application:
    name: bff-web

  config:
    # Optional config-server import: when config-service is up, bff-web.yml
    # (if a phase adds one) loads from it; when absent the app boots with the
    # local defaults below. Set CONFIG_SERVER_URL in k8s.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

bff:
  # Overridden in k8s via BFF_CATALOG_BASE_URL / BFF_CART_BASE_URL
  # (ClusterIP DNS names catalog-svc:8081 / cart-svc:8082).
  catalog:
    base-url: ${BFF_CATALOG_BASE_URL:http://localhost:8081}
  cart:
    base-url: ${BFF_CART_BASE_URL:http://localhost:8082}
  # WebClient connect/response timeout — failures degrade to partial payloads.
  timeout-ms: 2000

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      # Overridden in k8s via EUREKA_SERVER_URL env.
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true