apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests for bff-web — environment-agnostic.
namespace: ecommerce

labels:
  - pairs:
      app.kubernetes.io/part-of: ecommerce-platform

resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - serviceaccount.yaml
  - networkpolicy.yaml

images:
  - name: acr.azurecr.io/bff-web
    newName: acr.azurecr.io/bff-web
    newTag: latest