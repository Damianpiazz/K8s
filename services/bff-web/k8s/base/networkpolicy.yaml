apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff-web
  labels:
    app: bff-web
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  podSelector:
    matchLabels:
      app: bff-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the api-gateway may call the BFF API.
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
    # Prometheus scraping (/actuator/prometheus) from the observability ns.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
  egress:
    # DNS resolution (CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # catalog-svc (:8081), cart-svc (:8082) + config/discovery peers.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecommerce
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce-platform
    # Key Vault / kube-apiserver (443).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP