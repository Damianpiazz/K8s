# Test profile: no Eureka, no external config server, plain H2.
eureka:
  client:
    enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:catalogtest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false