# ── Checkout orchestration service ─────────────────────────────────────────
server:
  port: 8083

spring:
  application:
    name: checkout-svc

  config:
    # Optional config-server import (checkout-svc.yml from config-service, if
    # a phase adds one). When absent the app boots with local defaults below.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

checkout:
  # Overridden in k8s via CHECKOUT_CART_BASE_URL (cart-svc ClusterIP DNS).
  cart:
    base-url: ${CHECKOUT_CART_BASE_URL:http://localhost:8082}
    timeout-ms: 2000

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      # Overridden in k8s via EUREKA_SERVER_URL env.
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true