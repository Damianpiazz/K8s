apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-svc
  labels:
    app: checkout-svc
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  podSelector:
    matchLabels:
      app: checkout-svc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the api-gateway may call the checkout API.
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
    # Prometheus scraping (/actuator/prometheus) from the observability ns.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
  egress:
    # DNS resolution (CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # cart-svc (:8082) + config/discovery + future peers (order-svc, payment-svc…).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecommerce
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce-platform
    # Key Vault / kube-apiserver (443). Postgres (5432) when the order store
    # moves to Azure managed Postgres.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP