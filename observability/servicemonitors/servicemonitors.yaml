---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/managed-by: sdd
spec:
  jobLabel: app
  endpoints:
    - port: http
      # Keycloak 24 (con --metrics-enabled=true) sirve /metrics en el puerto
      # HTTP principal (8080); /actuator/prometheus no existe en Keycloak (es
      # de los servicios Spring Boot). Si la imagen sube a Keycloak 25+,
      # /metrics (y /health) migran al puerto de management 9000: mover este
      # endpoint y los probes juntos. En Azure/prod el endpoint puede requerir
      # token: agregar bearerTokenSecret a este endpoint (preocupación de
      # fase 3/5 — NO implementado aquí).
      path: /metrics
      interval: 30s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_label_env]
          targetLabel: env
  selector:
    matchLabels:
      app: auth
  namespaceSelector:
    matchNames:
      - ecommerce

