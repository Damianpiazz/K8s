---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/managed-by: sdd
spec:
  jobLabel: app
  endpoints:
    - port: http
      # Keycloak 24 exposes Prometheus metrics at /metrics (NOT
      # /actuator/prometheus — that path only exists on the Spring Boot
      # services). In prod, the metrics endpoint may require a token: enable
      # bearerTokenSecret on this endpoint or expose /metrics through the
      # realm's admin (see Keycloak docs "Enabling Prometheus metrics").
      path: /metrics
      interval: 30s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_label_env]
          targetLabel: env
  selector:
    matchLabels:
      app: auth
  namespaceSelector:
    matchNames:
      - ecommerce

