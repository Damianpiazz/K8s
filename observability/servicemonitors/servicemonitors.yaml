---
# ServiceMonitors — app-level scraping for the 17 e-commerce services.
#
# Phase 8 app layer: the Phase 3 kube-prometheus-stack bootstrap opens its
# selectors (cluster/base/monitoring/kube-prometheus-stack/values.yaml:
#   serviceMonitorSelector: {} and serviceMonitorNamespaceSelector: {})
# so Prometheus discovers ServiceMonitors from ANY namespace — these land in
# `observability` alongside the other monitoring resources.
#
# CONTRACT with the stack:
#   - namespaceSelector.matchNames: [ecommerce] is REQUIRED: a ServiceMonitor
#     only matches Services in its OWN namespace by default. These live in
#     observability, the Services live in ecommerce.
#   - spec.jobLabel: app  → the scrape job label becomes `job=<svc-name>`,
#     exactly what the platform rule in
#     cluster/base/monitoring/dashboard-example.yaml expects (job="order-svc").
#   - honorLabels: true → the app's own metric labels win over target labels.
#   - interval 30s matches the demo budget (6h retention, small scrape volume).
#   - path /actuator/prometheus + named port `http` — the convention every
#     service declares in services/*/k8s/base/service.yaml (port name `http`,
#     targetPort `http`, containerPort == service port).
#
# NetworkPolicy note: each service's per-service NetworkPolicy
# (services/*/k8s/base/networkpolicy.yaml) already allows ingress from the
# `observability` namespace and the `app.kubernetes.io/name: prometheus` pod,
# so scraping is permitted end-to-end.

### ── Infrastructure services ──────────────────────────────────────────────

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: config-service
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/managed-by: sdd
spec:
  jobLabel: app
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_label_env]
          targetLabel: env
  selector:
    matchLabels:
      app: config-service
  namespaceSelector:
    matchNames:
      - ecommerce
---
