---
# Namespaced ADMIN Role for the platform team (ecommerce namespace).
#
# "Admin" scoped to ONE namespace: every write verb the platform team needs
# to operate the shop — deployments, configmaps, secrets, networkpolicies —
# WITHOUT cluster-admin. Argo CD keeps its own cluster role; this role exists
# for humans doing break/fix inside ecommerce.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecommerce-admin
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "services", "endpoints", "configmaps", "secrets", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecommerce-admin-platform-team
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecommerce-admin
subjects:
  # Replace with your directory group (AAD group for AKS RBAC) or users.
  - kind: Group
    name: platform-team
    apiGroup: rbac.authorization.k8s.io