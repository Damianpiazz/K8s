apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace-level network policy layer (Phase 8 security).
# Deploy AFTER the services so the per-service policies are already in place
# and the default-deny only protects the gaps (see README.md).

namespace: ecommerce

labels:
  - pairs:
      app.kubernetes.io/part-of: ecommerce-platform

resources:
  - default-deny-all.yaml