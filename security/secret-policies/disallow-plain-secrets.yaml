---
# Kyverno ClusterPolicy — reject Secrets whose KEYS look like credentials.
#
# TRAINING EXAMPLE — read the comments before enabling. This policy flags a
# Secret whose key names hint at real secrets (password, token, api_key...)
# being written by hand — exactly the anti-pattern this platform forbids
# (external-secrets must own credentials, see security/secret-policies/readme.md).
#
# MODE: Audit (DEFAULT) — matches the repo precedent (require-resources is also
# Audit). It reports violations in the Kyverno UI / policy reports WITHOUT
# blocking. Students may flip validationFailureAction: Enforce AFTER tuning the
# regex list AND adding the external-secrets exclude block (commented below) —
# otherwise ESO-created Secrets like ecommerce-db-credentials (key db-password)
# would be REJECTED and break the platform.
#
# What it checks (both Opaque Secret encodings):
#   - `data`      → base64-encoded values: key names are still readable
#   - `stringData`→ plaintext values: key names readable too
# Only the KEY NAMES are matched (regex on keys(data)/keys(stringData)), never
# the VALUES — Kyverno must not touch secret material.
#
# Keys matched (?i, case-insensitive):
#   password, passwd, secret, token, api_key/apikey, private_key, credential
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-plain-secrets
  annotations:
    kyverno.io/training: "students must tune key regex + enable excludes before Enforce"
spec:
  validationFailureAction: Audit # ← flip to Enforce when tuned (see README)
  background: false              # admission-time only: don't spam policy reports
  rules:
    - name: no-secretish-keys-in-data
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ecommerce
      # exclude:                      # ← UNCOMMENT before flipping to Enforce
      #   any:                        #   ExternalSecrets-managed Secrets carry
      #     - resources:              #   this label (set by the ESO controller)
      #         selector:
      #           matchLabels:
      #             app.kubernetes.io/managed-by: external-secrets-operator
      preconditions:
        all:
          - key: "{{ request.object.type }}"
            operator: Equals
            value: Opaque
      validate:
        message: >-
          Secret key '{{ element }}' looks like a credential (password/token/secret/...).
          Secrets must come from Azure Key Vault via ExternalSecrets — never write
          credentials by hand.
        foreach:
          - list: "keys(data)"
            deny:
              conditions:
                any:
                  - key: "{{ element }}"
                    operator: Matches
                    value: "(?i)^.*(password|passwd|secret|token|api[-_]?key|private[-_]?key|credential).*$"
    - name: no-secretish-keys-in-stringdata
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ecommerce
      preconditions:
        all:
          - key: "{{ request.object.type }}"
            operator: Equals
            value: Opaque
      validate:
        message: >-
          Secret key '{{ element }}' looks like a credential (password/token/secret/...).
          Secrets must come from Azure Key Vault via ExternalSecrets — never write
          credentials by hand.
        foreach:
          - list: "keys(stringData)"
            deny:
              conditions:
                any:
                  - key: "{{ element }}"
                    operator: Matches
                    value: "(?i)^.*(password|passwd|secret|token|api[-_]?key|private[-_]?key|credential).*$"