apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Secret hygiene layer (Phase 8 security). The Kyverno ClusterPolicy is picked
# up with the other platform policies (the kyverno Application watches ClusterPolicies
# cluster-wide once this is applied; same mechanism as cluster/base/kyverno/policies).

labels:
  - pairs:
      app.kubernetes.io/part-of: ecommerce-platform

resources:
  - disallow-plain-secrets.yaml