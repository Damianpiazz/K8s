---
# Namespaces for the e-commerce platform
# These are created BEFORE Argo CD installs any applications.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
    env: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  # NOTE (fix 27): no `env` label here on purpose — each overlay signs the REAL
  # environment value via patches/env-patch.yaml (local|dev|staging|production).
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
    env: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
    env: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
    env: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
    env: platform
