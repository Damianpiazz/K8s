---
# ClusterSecretStore — glue between the cluster and Azure Key Vault.
#
# All namespaces can reference this store via a SecretStoreRef of
# kind: ClusterSecretStore (see example-external-secret.yaml).
#
# Authentication: Managed Identity (clientId) — the external-secrets
# controller POD identity must have "Key Vault Secrets User" on the vault.
# Alternative (recommended for AKS): authType: WorkloadIdentity with
# identityId = the user-assigned identity's client ID + workload identity
# federation on the external-secrets controller's service account.
#
# Requirements to fill in:
#   <kv-name>  → your Azure Key Vault name (created in infra/terraform)
#   AZURE_TENANT_ID → your AAD tenant id (matches the terraform tenant_id)
#   <identity-client-id> → client id of the managed identity used by ESO
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azure:
      tenantId: AZURE_TENANT_ID
      vaultUrl: https://<kv-name>.vault.azure.net # REPLACE with your vault name
      authType: ManagedIdentity
      identityId: <identity-client-id> # REPLACE with the managed identity client id