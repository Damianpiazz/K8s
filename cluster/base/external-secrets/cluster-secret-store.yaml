---
# ClusterSecretStore — glue between the cluster and Azure Key Vault.
#
# All namespaces can reference this store via a SecretStoreRef of
# kind: ClusterSecretStore (see example-external-secret.yaml).
#
# Authentication (Fase 5): ManagedIdentity via IMDS with the AKS cluster
# kubelet system-assigned identity.
#   - terraform grants that identity 'Key Vault Secrets User' on the vault
#     (infra/terraform/modules/keyvault, data-plane RBAC — no access policies).
#   - identityId below = the kubelet identity CLIENT ID
#     (terraform output: eso_identity_client_id).
# Each Azure overlay (dev/staging/prod) patches tenantId / vaultUrl /
# identityId with its own values (patches/secret-store-patch.yaml).
# The local overlay deletes this store (no Key Vault in the emulator).
#
# Alternative (recommended for production hardening): authType: WorkloadIdentity
# with a dedicated user-assigned identity + federated credential on the ESO
# controller's ServiceAccount — see fix 29 for the trade-off.
#
# Requirements to fill in (per Azure overlay patch):
#   <tenant-id> → tenant of the Key Vault (terraform output keyvault_tenant_id)
#   <kv-name>  → your Azure Key Vault name (terraform output keyvault_name)
#   <identity-client-id> → client id of the identity ESO uses on the node
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azure:
      tenantId: AZURE_TENANT_ID
      vaultUrl: https://<kv-name>.vault.azure.net # REPLACE with your vault name
      authType: ManagedIdentity
      identityId: <identity-client-id> # REPLACE with the managed identity client id