---
# ExternalSecret — Grafana admin password (fix 27).
#
# The Grafana subchart (kube-prometheus-stack 61.9.0 → grafana 8.4.x) reads
# `grafana.admin.existingSecret: grafana-admin-credentials` and takes the
# password from the key `admin-password` of that Secret (admin.passwordKey
# default).
#
# Mirror of the Keycloak pattern (services/auth/k8s/base/external-secret.yaml):
# dev/staging/prod materialise the Secret via Azure Key Vault (vault secret
# `grafana-admin-password`, seeded by Fase 5 / terraform). The local overlay
# deletes this ExternalSecret (no Key Vault emulado) and ships its own
# placeholder Secret — see cluster/overlays/local/grafana-admin-credentials.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin-password # name of the secret inside Azure Key Vault