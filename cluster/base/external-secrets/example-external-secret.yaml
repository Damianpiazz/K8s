---
# Example ExternalSecret — reads db-password from Azure Key Vault and writes
# it into a regular Kubernetes Secret for the ecommerce workloads.
#
# Result: a Secret named ecommerce-db-credentials in namespace ecommerce
# containing the key db-password (value from the vault).
#
# Requirements to fill in (in Key Vault, not in this file):
#   - a vault secret named "db-password" (its value becomes the Secret value)
#   - the ClusterSecretStore must point at your vault (see cluster-secret-store.yaml)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ecommerce-db-credentials
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: ecommerce-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: db-password # name of the secret inside Azure Key Vault