---
# ExternalSecret — credenciales Postgres del servidor gestionado (Fase 6).
#
# Materializa el Secret `db-credentials` (ns ecommerce) desde Key Vault:
#   username ← db-username  (administrator_login del Flexible Server)
#   password ← db-password  (administrator_password — misma variable tfvars
#                             que consume el módulo databases: fijar UNA vez
#                             en terraform.tfvars y la cadena alinea la DB)
#
# Consumidores:
#   - Datasource de catalog/order/inventory/payment-svc (env overlays)
#   - Sidecars postgres:16-alpine del overlay local (POSTGRES_USER/PASSWORD)
#   - Keycloak Azure (KC_DB_USERNAME / KC_DB_PASSWORD, fix 30)
#
# En local este ExternalSecret se excluye (overlays/local) y el Secret
# placeholder `db-credentials` corre plano.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: db-username
    - secretKey: password
      remoteRef:
        key: db-password