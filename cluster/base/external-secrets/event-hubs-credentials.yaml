---
# ExternalSecret — Event Hubs SASL credentials (Kafka on Azure).
#
# Kafka clients (checkout-svc producer, notification-svc consumer) connect to
# the Event Hubs Kafka endpoint with SASL_SSL. Azure Event Hubs SASL convention:
#   username = "$ConnectionString"  (constant)
#   password = the namespace connection string
#
# The Key Vault secrets are seeded by terraform (modules/keyvault):
#   event-hubs-sasl-username  → "$ConnectionString"
#   event-hubs-sasl-password  → streaming module connection string
#
# The resulting Secret `event-hubs-credentials` (sasl-username/sasl-password)
# is consumed by the Azure overlays' deployment patches (checkout-svc,
# notification-svc) and is the same name/keys the KEDA ScaledObject example
# expects ($EVENT_HUBS_SASL_USERNAME / $EVENT_HUBS_SASL_PASSWORD).
# The local overlay deletes this ExternalSecret (no Key Vault; PLAINTEXT).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: event-hubs-credentials
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: event-hubs-credentials
    creationPolicy: Owner
  data:
    - secretKey: sasl-username
      remoteRef:
        key: event-hubs-sasl-username
    - secretKey: sasl-password
      remoteRef:
        key: event-hubs-sasl-password