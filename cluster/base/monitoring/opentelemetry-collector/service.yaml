---
# Service in front of the OpenTelemetry Collector.
# Applications send OTLP to: otel-collector.observability.svc:4317 (gRPC)
#                            otel-collector.observability.svc:4318 (HTTP)
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: prom-metrics
      port: 8889
      targetPort: prom-metrics