---
# kube-prometheus-stack Helm chart values.
#
# Consumed by:
#   - Argo CD Application kube-prometheus-stack (multi-source, $values path)
#   - helmfile.yaml (alternative bootstrap)
#
# Design goals (see docs/PLAN.md):
#   - Cost-conscious for a student cluster: Alertmanager off, default rules off,
#     short Prometheus retention, Grafana WITHOUT persistent storage.
#   - Selectors are OPENED so the stack discovers the ServiceMonitors the
#     services emit (Phase 4+) from ANY namespace, and the example
#     PrometheusRule (dashboard-example.yaml) is loaded regardless of labels.

# Default alert/record rules from the chart are disabled — the platform ships
# its own SLO rules (see dashboard-example.yaml).
defaultRules:
  create: false

# Alertmanager is not needed for the student budget; keep the cost low.
alertmanager:
  enabled: false

grafana:
  # Admin credentials via external-secrets (fix 27): the Grafana subchart
  # (8.4.x, bundled by kube-prometheus-stack 61.9.0) reads the key
  # `admin-password` (admin.passwordKey default) from the Secret named in
  # admin.existingSecret. dev/staging/prod materialise that Secret with the
  # ExternalSecret `grafana-admin-credentials` → Azure Key Vault (vault secret
  # `grafana-admin-password`); the local overlay ships its own placeholder
  # Secret instead. No password literal ever lives in this file.
  admin:
    existingSecret: grafana-admin-credentials
  persistence:
    enabled: false # no PVC — dashboards are provisioned via ConfigMaps
  # Keycloak OAuth (Phase 4): ONLY the ConfigMap NAME lives here — the actual
  # GF_* env vars are per-environment (hosts/URLs differ), shipped by each
  # overlay's grafana-oauth-config.yaml. The Grafana subchart (8.4.x) injects
  # ConfigMaps listed in envFromConfigMaps as env vars into the pod. NOTE: the
  # chart expects OBJECTS ({name: ...}), not plain strings — a string list
  # renders "name: <no value>" in the pod envFrom (verified against chart 8.4.4).
  envFromConfigMaps:
    - name: grafana-oauth-config
  # Client secret (Fase 5): moved OUT of the ConfigMap into a Secret. The
  # overlay ConfigMaps no longer carry GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET;
  # this env var (envValueFrom, supported by the chart 8.4.4 — _pod.tpl
  # renders .Values.envValueFrom) injects it from the Secret
  # grafana-oauth-credentials:
  #   - dev/staging/prod → ExternalSecret (grafana-oauth-secret.yaml overlay)
  #     syncing Key Vault `grafana-oauth-client-secret`.
  #   - local → placeholder Secret (cluster/overlays/local/grafana-oauth-credentials.yaml).
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oauth-credentials
        key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
  # ServiceMonitor for grafana itself would be nice, but skip for now (cost).

# Control-plane components that AKS manages for you — no need to scrape them.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: true

prometheus:
  prometheusSpec:
    retention: 6h # dev budget: 6 hours of history is enough for demos
    # No persistent volume — a fresh scrape history on restart is fine in dev.
    storageSpec: {}
    # Open the rule/ServiceMonitor selectors so resources from ALL namespaces
    # (ecommerce, observability, ...) are picked up:
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

nodeExporter:
  enabled: true
  # Allow node-exporter to run on system pools (AKS taints its system pool).
  tolerations:
    - operator: Exists

kubeStateMetrics:
  enabled: true