---
# Kyverno ClusterPolicy: every container must declare resource requests+limits.
#
# Scope: Pods in the app/tenant namespaces (chart-managed namespaces excluded).
#
# Mode: Audit (default) — reports violations without blocking. The chart
# defaults of several components do not define resources yet; switch this
# policy to Enforce AFTER every workload in the cluster declares resources
# (ingress-nginx values already do — see values.yaml resources block).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resources
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-cpu-memory-requests-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values:
                      - kube-system
                      - argocd
                      - kyverno
                      - platform
                      - cert-manager
                      - ingress-nginx
                      - external-dns
                      - external-secrets
                      - keda
                      - observability
      validate:
        message: "Every container must define cpu/memory requests and limits."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"