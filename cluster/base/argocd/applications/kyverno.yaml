---
# kyverno — policy engine (ClusterPolicy CRDs + validating webhook).
#
# IMPORTANT: kyverno chart 3.x no longer bundles CRDs by default; kyverno
# support policy CRDs must exist BEFORE the ClusterPolicies in
# cluster/base/kyverno/policies/ are applied. The sync policy annotations
# below only order things INSIDE Argo CD — the bootstrap README covers the
# kubectl-side ordering for the initial apply.
#
# Requirements to fill in:
#   - Helm chart version: "bump me" — check https://github.com/kyverno/kyverno/releases
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: kyverno
    repoURL: https://kyverno.github.io/kyverno/
    targetRevision: 3.2.6 # bump me: verify latest stable chart version
    helm:
      releaseName: kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true