---
# ingress-nginx — reverse proxy / ingress controller.
#
# Multi-source Application:
#   source 1: the official ingress-nginx Helm chart from its Helm repository.
#   source 2: this repository (ref: values) — provides cluster/base/ingress-nginx/values.yaml
#             referenced via $values/... in the helm valueFiles.
#
# Requirements to fill in:
#   - Helm chart version: "bump me" — check https://github.com/kubernetes/ingress-nginx/releases
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: ingress-nginx
      repoURL: https://kubernetes.github.io/ingress-nginx
      targetRevision: 4.11.3 # bump me: verify latest stable chart version
      helm:
        releaseName: ingress-nginx
        valueFiles:
          - $values/cluster/base/ingress-nginx/values.yaml
    - repoURL: https://github.com/<org>/<repo>.git # REPLACE with your repository
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true