---
# external-secrets — syncs Azure Key Vault secrets into Kubernetes Secrets.
#
# The chart installs the ExternalSecret/ClusterSecretStore CRDs used by
# cluster/base/external-secrets/ (see bootstrap order in README).
#
# Requirements to fill in:
#   - Helm chart version: "bump me" — check https://github.com/external-secrets/external-secrets/releases
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    targetRevision: 0.10.5 # bump me: verify latest stable chart version
    helm:
      releaseName: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true