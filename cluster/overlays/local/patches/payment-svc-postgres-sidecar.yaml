---
# Fase 6 — payment-svc con PostgreSQL REAL vía sidecar (local).
# Misma convención que catalog-svc-postgres-sidecar.yaml (fix 30):
# postgres:16-alpine, DB `payments`, credenciales del Secret db-credentials.
# NOTA: el store de PaymentService sigue siendo el HashMap en memoria (sin JPA
# aún); el datasource ya apunta a Postgres para que el arranque no caiga y la
# paridad quede lista cuando aterrice la implementación JPA (ver fix 30).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-svc
spec:
  template:
    spec:
      containers:
        - name: payment-svc
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://127.0.0.1:5432/payments
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: org.postgresql.Driver
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: payments
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: