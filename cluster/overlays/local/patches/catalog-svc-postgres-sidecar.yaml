---
# Fase 6 — catalog-svc con PostgreSQL REAL vía sidecar (local).
#
# Local no tiene Flexible Server de Azure: cada servicio con datasource levanta
# un sidecar postgres:16-alpine en SU pod (misma versión mayor que Azure,
# postgres_version=16) con la DB propia, y la app apunta a 127.0.0.1:5432.
# Con esto el comportamiento local == Azure (antes corría H2 en memoria).
#   - Los enví de SPRING_* del contenedor OVERRIDEAN el envFrom del CM
#     (precedencia: env > envFrom) — el base ya no lleva jdbc:h2.
#   - Credenciales: Secret db-credentials (placeholder local; en Azure es el
#     ExternalSecret → Key Vault). Espacio: emptyDir efímero (demo, sin PVC).
#   - En Azure NO hay sidecar: patches/catalog-svc-datasource.yaml apunta al
#     Flexible Server vía ${DB_HOST}:${DB_PORT}.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-svc
spec:
  template:
    spec:
      containers:
        - name: catalog-svc
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://127.0.0.1:5432/catalog
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: org.postgresql.Driver
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: catalog
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: