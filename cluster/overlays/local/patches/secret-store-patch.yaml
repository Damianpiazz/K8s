---
# Patch: ClusterSecretStore vault URL para LOCAL.
#
# Strategic merge patch — matchea el resource "azure-keyvault" de
# cluster/base/external-secrets/cluster-secret-store.yaml.
#
# En local el provider azure de ESO apunta al Key Vault EMULADO por floci.
# La autenticacion (ManagedIdentity) NO aplica contra el emulador — por
# verificar si ESO puede usar floci tal cual o si hace falta deshabilitar
# el store / usar un secret-store own-cluster en local (ver data/).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azure:
      tenantId: 00000000-0000-0000-0000-000000000002  # fake, emulador
      vaultUrl: https://host.docker.internal:4577/devstoreaccount1-keyvault # REPLACE si el KV emulado usa otro nombre
      authType: ManagedIdentity
      identityId: 00000000-0000-0000-0000-000000000000