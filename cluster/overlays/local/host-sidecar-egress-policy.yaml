---
# Local-only egress allowance: sidecars de datos del emulador (fix 18 / fix 30).
#
# Las NetworkPolicies base de los services abren 443/5432 a 0.0.0.0/0 pensando
# en Azure (Postgres 5432). El Kafka local escucha en 9093, así que el
# default-deny egress bloquearía las conexiones al host.
# NOTA (fix 30): los 4 services con datasource (catalog/order/payment/inventory)
# ya NO necesitan egress al host — corren su sidecar postgres:16-alpine EN EL
# POD (127.0.0.1). El egress al host queda SOLO para Kafka (notification-svc
# consumer + checkout-svc productor).
#
# Esta policy ES ADITIVA (las NetworkPolicies del namespace se unen): solo
# agrega egress hacia la pasarela del bridge Docker (172.22.0.1 = el HOST,
# CoreDNS fix 17) para los puertos de datos. No modifica las policies base.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-host-sidecars
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
    env: local
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - notification-svc
          - checkout-svc
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 172.22.0.1/32
      ports:
        - port: 9093
          protocol: TCP