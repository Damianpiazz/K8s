---
# Argo CD RBAC — grupos de Keycloak (Phase 4). Variante local (idéntica a la de
# Azure: el claim `groups` viene del Group Membership mapper del client
# `argocd` del realm, con flat path → valor exacto `ecommerce-admins`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.csv: |
    g, ecommerce-admins, role:admin