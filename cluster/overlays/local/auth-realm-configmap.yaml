---
# Keycloak realm LOCAL — reemplaza el realm embebido en la imagen.
#
# El realm del base usa redirectUris con el placeholder api.<domain>
# (https://api.<domain>/callback), que Keycloak rechaza: "<" y ">" no son
# caracteres válidos de URI y la importación aborta. En Azure el CD reemplaza
# <domain> en build; en local se monta ESTA variante con hosts *.localhost,
# válidos RFC 1123, sin depender de DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-realm-local
  namespace: ecommerce
data:
  realm-export.json: |
    {
      "realm": "ecommerce",
      "enabled": true,
      "displayName": "E-commerce Platform",
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginTheme": "keycloak",
      "accountTheme": "keycloak",
      "adminTheme": "keycloak",
      "defaultSignatureAlgorithm": "RS256",
      "roles": {
        "realm": [
          { "name": "admin", "description": "Platform administrators" },
          { "name": "user",  "description": "Regular e-commerce users" }
        ]
      },
      "users": [
        {
          "username": "demo",
          "enabled": true,
          "email": "demo@ecommerce.local",
          "firstName": "Demo",
          "lastName": "User",
          "emailVerified": true,
          "credentials": [
            { "type": "password", "value": "demo123", "temporary": false }
          ],
          "realmRoles": [ "user" ],
          "groups": [ "ecommerce-admins" ]
        }
      ],
      "groups": [
        {
          "name": "ecommerce-admins",
          "description": "Platform administrators — mapped to role:admin in Argo CD and Admin in Grafana"
        }
      ],
      "clients": [
        {
          "clientId": "ecommerce-web",
          "name": "E-commerce Web Application (SPA)",
          "description": "Public client — browser frontend. No secret, PKCE enabled.",
          "enabled": true,
          "publicClient": true,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "redirectUris": [ "http://localhost:*", "http://www.localhost/*", "https://api.localhost/callback" ],
          "webOrigins": [ "http://localhost:*", "http://www.localhost:*", "https://api.localhost" ],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          }
        },
        {
          "clientId": "ecommerce-api",
          "name": "E-commerce API (gateway / machine-to-machine)",
          "description": "Confidential client. JWTs validated by the api-gateway via JWKS. REPLACE the placeholder secret.",
          "enabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "REPLACE_WITH_A_SECURE_CLIENT_SECRET",
          "attributes": {
            "use.jwks.url": "true"
          }
        },
        {
          "clientId": "argocd",
          "name": "Argo CD (GitOps UI)",
          "description": "Confidential client — Argo CD OIDC login. Secret must match the oidc-argocd Kubernetes Secret (returned via $oidc-argocd:clientSecret). REPLACE the placeholder.",
          "enabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "REPLACE_WITH_A_SECURE_CLIENT_SECRET",
          "redirectUris": [ "https://argocd.localhost/auth/callback" ],
          "webOrigins": [ "https://argocd.localhost" ],
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "claim.name": "groups"
              }
            }
          ]
        },
        {
          "clientId": "grafana",
          "name": "Grafana (observability UI)",
          "description": "Confidential client — Grafana generic OAuth login. Secret must match GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET in the Secret grafana-oauth-credentials (placeholder local, ExternalSecret → Key Vault en Azure). REPLACE the placeholder.",
          "enabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "REPLACE_WITH_A_SECURE_CLIENT_SECRET",
          "redirectUris": [ "https://grafana.localhost/login/generic_oauth" ],
          "webOrigins": [ "https://grafana.localhost" ],
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "claim.name": "groups"
              }
            }
          ]
        }
      ]
    }