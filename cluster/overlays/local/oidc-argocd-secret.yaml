---
# OIDC client secret para Argo CD (Phase 4) — variante local.
# Referenciado por argocd-cm vía clientSecret: $oidc-argocd:clientSecret.
# El valor DEBE coincidir con el client `argocd` del realm local
# (auth-realm-configmap.yaml).
# TODO(F5): reemplazar el literal por un ExternalSecret cuando local tenga
# SecretStore (el ClusterSecretStore azure-keyvault sigue excluido en local).
apiVersion: v1
kind: Secret
metadata:
  name: oidc-argocd
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  clientSecret: REPLACE_WITH_A_SECURE_CLIENT_SECRET