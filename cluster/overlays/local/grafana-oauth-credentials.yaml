---
# Secret placeholder del OAuth client de Grafana — LOCAL (Fase 5).
#
# En Azure este Secret lo materializa external-secrets (ExternalSecret
# grafana-oauth-credentials → Key Vault, ver overlays/{dev,staging,prod}/
# grafana-oauth-secret.yaml). En local no hay ClusterSecretStore, así que el
# Secret se monta plano — el valor debe coincidir con el client `grafana` del
# realm local (auth-realm-configmap.yaml) y es el mismo placeholder del
# contrato realm/secret (fix 29).
#
# El pod de Grafana lo consume vía grafana.envValueFrom en values.yaml del
# stack (GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET) — el ConfigMap
# grafana-oauth-config.yaml ya no lleva la key.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-oauth-credentials
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
type: Opaque
stringData:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: REPLACE_WITH_A_SECURE_CLIENT_SECRET