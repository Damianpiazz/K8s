---
# Per-environment ConfigMap — LOCAL (emulador Floci-AZ).
#
# Los services consumen esto via envFrom en sus Deployments.
# En local los sidecars (postgres, valkey, redpanda) bindean puertos del HOST
# (ports.md) — los pods k3s los alcanzan via host.docker.internal.
#
# Nota: el postgres sidecar NO pide credenciales (emulado, tabla vacia) —
# los services locales usan las credentials in-cluster de data/ o H2.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-env-config
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
    env: local
data:
  ENVIRONMENT: local
  LOG_LEVEL: DEBUG

  # ── Data connections (sidecars en el host) ─────────────────────────────
  # NOTA (fix 30): los 4 services con datasource (catalog/order/inventory/
  # payment) ya NO consumen DB_HOST/DB_PORT — corren un sidecar postgres:16-
  # alpine en SU pod (127.0.0.1:5432/DB propia, ver patches/*-postgres-
  # sidecar.yaml). Estas keys quedan por compatibilidad con consumidores
  # legacy (el postgres del emulador bindea un puerto DINAMICO del host; no
  # usar como referencia de los services).
  DB_HOST: host.docker.internal
  DB_PORT: "37865"
  DB_NAME: ecommerce
  REDIS_HOST: host.docker.internal
  REDIS_PORT: "6379"                    # valkey local sin TLS

  # ── Messaging (Kafka endpoint) ─────────────────────────────────────────
  # En local el emulador NO levanta el sidecar Redpanda (solo Artemis/AMQP);
  # el endpoint Kafka lo sirve el contenedor floci-az-kafka-sc (fix 16).
  KAFKA_BOOTSTRAP: host.docker.internal:9093
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT    # local sin SASL_SSL
  # Consumer de eventos de notification-svc (base lo apaga para tests/CI).
  NOTIFICATIONS_KAFKA_ENABLED: "true"
  # Productor de eventos de checkout (base lo apaga para tests/CI).
  CHECKOUT_EVENTS_KAFKA_ENABLED: "true"

  # ── Feature flags (local extras) ───────────────────────────────────────
  ENABLE_SWAGGER: "true"
  ENABLE_MOCK_DATA: "true"