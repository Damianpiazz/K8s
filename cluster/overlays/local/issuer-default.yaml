---
# ClusterIssuer: letsencrypt-default (LOCAL → selfsigned).
#
# En dev el issuer usa el servidor staging ACME de Let's Encrypt. En local NO
# hay internet confiable desde el cluster, entonces letsencrypt-default es
# selfsigned — los servicios que referencian la annotation
#   cert-manager.io/cluster-issuer: letsencrypt-default
# obtienen certificados firmados por la CA interna de k3s / floci.
#
# El base ya trae los issuers: selfsigned, letsencrypt-staging, letsencrypt-prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-default
spec:
  selfSigned: {}