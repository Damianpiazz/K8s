---
# ClusterIssuer LOCAL (Phase 4) — mismo nombre que en dev/staging/prod
# (`letsencrypt-default`) pero de tipo selfSigned: floci no tiene DNS ni acceso
# a ACME. Los ingresses (auth, argocd, grafana, ...) resuelven la anotación
# cert-manager.io/cluster-issuer en cualquier overlay; acá los certificados son
# autofirmados — se prueba https:// + TLS completo sin depender de internet
# (el navegador mostrará advertencia de cert, esperado en local).
#
# TODO(F4): reemplazar por un issuer real (ACME) cuando floci tenga dominio.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-default
spec:
  selfSigned: {}