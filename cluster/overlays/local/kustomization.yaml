---
# Kustomize overlay â€” LOCAL (emulador Floci-AZ).
#
# Espejo del overlay DEV con estas diferencias (plan-implementacion 4.1):
#   - `resources: - ../../base` (el mismo base que dev) PERO con delete
#     patches que sacan: las Argo CD Applications (app-of-apps + plataforma +
#     ambiente â€” el bootstrap local aplica componentes directo), external-dns
#     (apunta a DNS de Azure; descartado en local) y el example-external-secret
#     (en local el ClusterSecretStore apunta al Key Vault emulado por floci).
#   - ClusterIssuer letsencrypt-default -> selfsigned (sin internet)
#   - ClusterSecretStore vault URL -> https://host.docker.internal:4577/<kv>
#   - ecommerce-env-config -> hosts host.docker.internal (sidecars en el host)
#   - images -> host.docker.internal:5000/localecommercefloci01/<svc>
#
# Uso:
#   kubectl apply -k cluster/overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # â”€â”€ Base completo (igual que dev) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - ../../base
  # â”€â”€ Overlay local â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # issuer-default.yaml NO se referencia: cert-manager no se instala en local
  # y patches/cert-manager-delete.yaml barre TODOS los ClusterIssuer del
  # build (kind-wide). El archivo queda como documentaciÃ³n de la intenciÃ³n.
  - env-config.yaml
  - auth-realm-configmap.yaml
  - host-sidecar-egress-policy.yaml

  # Exclusión de HPA (fix 13 durable): en nodo único el autoscaler satura el
  # k3s; la limpieza runtime no sobrevive al proximo apply. Los deletes son
  # POR NOMBRE (kustomize v5 no soporta kind-wide) y van INLINE en patches:
  # un archivo kind: Kustomization/Component en resources:/components: exige
  # un directorio, no un archivo (error "must build at directory").

  # â”€â”€ Services (Phase 5 â€” core; cada servicio usa sus manifests BASE) â”€â”€â”€â”€
  - ../../../services/config-service/k8s/base
  - ../../../services/discovery-service/k8s/base
  - ../../../services/api-gateway/k8s/base
  - ../../../services/auth/k8s/base
  - ../../../services/catalog-svc/k8s/base
  - ../../../services/cart-svc/k8s/base
  # â”€â”€ Services (Phase 6 â€” business) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - ../../../services/checkout-svc/k8s/base
  - ../../../services/order-svc/k8s/base
  - ../../../services/payment-svc/k8s/base
  - ../../../services/notification-svc/k8s/base
  - ../../../services/bff-web/k8s/base
  # â”€â”€ Services (Phase 7 â€” extra) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - ../../../services/search-svc/k8s/base
  - ../../../services/recommendation-svc/k8s/base
  - ../../../services/inventory-svc/k8s/base
  - ../../../services/shipping-svc/k8s/base
  - ../../../services/returns-svc/k8s/base
  - ../../../services/analytics-svc/k8s/base
  - ../../../services/frontend/k8s/base
  # â”€â”€ Observability / Security app layers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - ../../../observability
  - ../../../security

patches:
  # â”€â”€ Keycloak local: realm montado sobre el de la imagen â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # La imagen embebe services/auth/src/realm-export.json con redirectUris
  # que usan el placeholder api.<domain> (URI invÃ¡lida -> Keycloak aborta la
  # importaciÃ³n). En local se monta auth-realm-configmap.yaml encima del
  # path de import para hosts *.localhost. AdemÃ¡s start-dev NO expone
  # /health/* sin --health-enabled=true; los probes del Deployment asumen
  # que existen, asÃ­ que se activa (igual que en prod) para escapar del
  # kill-loop por liveness 404.
  - target:
      kind: Deployment
      name: auth
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth
      spec:
        template:
          spec:
            volumes:
              - name: auth-realm
                configMap:
                  name: auth-realm-local
            containers:
              - name: auth
                volumeMounts:
                  - name: auth-realm
                    mountPath: /opt/keycloak/data/import/realm-export.json
                    subPath: realm-export.json
                command: ["/opt/keycloak/bin/kc.sh"]
                args: ["start-dev", "--import-realm", "--health-enabled=true"]

  # â”€â”€ Data plane local: services con datasource -> Postgres sidecar â”€â”€â”€â”€â”€â”€
  # Los configmaps base de estos servicios dejan H2 in-memory (demo), pero
  # los env del CONTAINER tienen precedencia sobre envFrom (misma clave), asÃ­
  # que se apunta explicito al sidecar Postgres del emulador (fix 18). El
  # puerto es dinamico en el host (ver `docker port`); ddl-auto=update crea
  # el schema sobre la DB `ecommerce` del sidecar y ENABLE_MOCK_DATA=true
  # re-siembra los datos demo.
  - target:
      kind: Deployment
      name: catalog-svc
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: catalog-svc
      spec:
        template:
          spec:
            containers:
              - name: catalog-svc
                env:
                  - name: SPRING_DATASOURCE_URL
                    value: jdbc:postgresql://host.docker.internal:37865/ecommerce
                  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
                    value: org.postgresql.Driver
                  - name: SPRING_DATASOURCE_USERNAME
                    value: psqladmin
                  - name: SPRING_DATASOURCE_PASSWORD
                    value: <fuerte-sin-@>
                  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
                    value: update
  - target:
      kind: Deployment
      name: order-svc
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: order-svc
      spec:
        template:
          spec:
            containers:
              - name: order-svc
                env:
                  - name: SPRING_DATASOURCE_URL
                    value: jdbc:postgresql://host.docker.internal:37865/ecommerce
                  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
                    value: org.postgresql.Driver
                  - name: SPRING_DATASOURCE_USERNAME
                    value: psqladmin
                  - name: SPRING_DATASOURCE_PASSWORD
                    value: <fuerte-sin-@>
                  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
                    value: update
  - target:
      kind: Deployment
      name: payment-svc
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payment-svc
      spec:
        template:
          spec:
            containers:
              - name: payment-svc
                env:
                  - name: SPRING_DATASOURCE_URL
                    value: jdbc:postgresql://host.docker.internal:37865/ecommerce
                  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
                    value: org.postgresql.Driver
                  - name: SPRING_DATASOURCE_USERNAME
                    value: psqladmin
                  - name: SPRING_DATASOURCE_PASSWORD
                    value: <fuerte-sin-@>
                  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
                    value: update
  - target:
      kind: Deployment
      name: inventory-svc
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: inventory-svc
      spec:
        template:
          spec:
            containers:
