---
# Kustomize overlay — LOCAL (emulador Floci-AZ).
#
# Espejo del overlay DEV con estas diferencias (docs/PLAN.md, Fase 1/4 y 4):
#   - GITOPS TOTAL (Phase 4): las Applications de plataforma (ingress-nginx,
#     cert-manager, external-secrets, kyverno, keda, kube-prometheus-stack) se
#     IMPORTAN — Argo CD instala y gobierna los operadores igual que en Azure.
#     Quedan excluidas SOLO: ecommerce-apps (app-of-apps apuntando a las env
#     apps de Azure), ecommerce-{dev,staging,prod}, external-dns (DNS de Azure),
#     example-external-secret, ClusterSecretStore azure-keyvault + ExternalSecrets
#     (local usa Secrets placeholder) y el ScaledObject order-worker
#     (placeholder de Event Hubs).
#   - ecommerce-local Application (nueva, Phase 4): el overlay se autogestiona
#     vía Argo CD (git push → sync), mismo mecanismo que Azure.
#   - ClusterIssuer letsencrypt-default → selfSigned (sin DNS ni ACME en floci).
#   - Los 18 HPA se IMPORTAN (Phase 4): k3s trae metrics-server de fábrica; fix 13
#     (exclusión de HPA) quedó superado.
#   - ClusterIssuer letsencrypt-{staging,prod} siguen borrados (no hay ACME).
#   - UIs expuestas con hosts *.localhost + SSO Keycloak local (Phase 4):
#     argocd.localhost / grafana.localhost / auth.localhost.
#   - ClusterSecretStore vault URL -> https://host.docker.internal:4577/<kv>
#   - ecommerce-env-config -> hosts host.docker.internal (sidecars en el host)
#   - images -> host.docker.internal:5000/localecommercefloci01/<svc>
#
# Uso:
#   kubectl apply -k cluster/overlays/local          # (después del bootstrap, ver fix 28)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # â”€â”€ Base completo (igual que dev) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - ../../base
  # â”€â”€ Overlay local â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # issuer-default.yaml -> ClusterIssuer letsencrypt-default selfSigned (Phase 4):
  # los ingresses lo referencian por nombre; local no tiene DNS/ACME, ver el archivo.
  - env-config.yaml
  - auth-realm-configmap.yaml
  - host-sidecar-egress-policy.yaml
  # Secrets placeholder (local): en Azure los materializa external-secrets
  # desde el Key Vault; en local no hay ClusterSecretStore, asi que el Secret
  # grafana-admin-credentials se monta plano (el de Keycloak viene del base:
  # services/auth/k8s/base/admin-credentials.yaml).
  - grafana-admin-credentials.yaml
  # ── SSO UIs (Phase 4): Argo CD OIDC + Grafana OAuth via Keycloak ──
  - argocd-cm.yaml
  - argocd-rbac-cm.yaml
  - oidc-argocd-secret.yaml
  - grafana-oauth-config.yaml
  # Fase 5: Secret placeholder del client de Grafana (en Azure lo materializa
  # el ExternalSecret grafana-oauth-credentials → Key Vault).
  - grafana-oauth-credentials.yaml
  # Fase 6: Secret placeholder del datasource/Postgres (en Azure lo materializa
  # el ExternalSecret db-credentials → Key Vault).
  - db-credentials.yaml
  # ── GitOps (Phase 4): issuer local + Application autogestionada ──
  - issuer-default.yaml
  - ecommerce-local.yaml

  # HPA (fix 13 revertido en Phase 4): k3s trae metrics-server de fábrica; los
  # 18 HPA del base se importan sin saturar el nodo único. Ver fix 28.

  # ── Services (Phase 5 â€” core; cada servicio usa sus manifests BASE) â”€â”€â”€â”€
  - ../../../services/config-service/k8s/base
  - ../../../services/discovery-service/k8s/base
  - ../../../services/api-gateway/k8s/base
  - ../../../services/auth/k8s/base
  - ../../../services/catalog-svc/k8s/base
  - ../../../services/cart-svc/k8s/base
  # â”€â”€ Services (Phase 6 â€” business) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - ../../../services/checkout-svc/k8s/base
  - ../../../services/order-svc/k8s/base
  - ../../../services/payment-svc/k8s/base
  - ../../../services/notification-svc/k8s/base
  - ../../../services/bff-web/k8s/base
  # â”€â”€ Services (Phase 7 â€” extra) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - ../../../services/search-svc/k8s/base
  - ../../../services/recommendation-svc/k8s/base
  - ../../../services/inventory-svc/k8s/base
  - ../../../services/shipping-svc/k8s/base
  - ../../../services/returns-svc/k8s/base
  - ../../../services/analytics-svc/k8s/base
  - ../../../services/frontend/k8s/base
  # â”€â”€ Observability / Security app layers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - ../../../observability
  - ../../../security

patches:
  # â”€â”€ Keycloak local: realm montado sobre el de la imagen â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # La imagen embebe services/auth/src/realm-export.json con redirectUris
  # que usan el placeholder api.<domain> (URI invÃ¡lida -> Keycloak aborta la
  # importaciÃ³n). En local se monta auth-realm-configmap.yaml encima del
  # path de import para hosts *.localhost. AdemÃ¡s start-dev NO expone
  # /health/* sin --health-enabled=true; los probes del Deployment asumen
  # que existen, asÃ­ que se activa (igual que en prod) para escapar del
  # kill-loop por liveness 404.
  - target:
      kind: Deployment
      name: auth
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth
      spec:
        template:
          spec:
            volumes:
              - name: auth-realm
                configMap:
                  name: auth-realm-local
            containers:
              - name: auth
                volumeMounts:
                  - name: auth-realm
                    mountPath: /opt/keycloak/data/import/realm-export.json
                    subPath: realm-export.json
                command: ["/opt/keycloak/bin/kc.sh"]
                args: ["start-dev", "--import-realm", "--health-enabled=true", "--metrics-enabled=true"]

  # ── UIs (Phase 4): hosts *.localhost ─────────────────────────────────────────────
  # Los ingresses del base traen argocd.<domain> / grafana.<domain> / auth.<domain>;
  # en local se reescriben a *.localhost (resuelve contra el nodo k3s: 10.42.0.1).
  # El secretName del TLS queda igual (argocd-tls / grafana-tls / auth-tls) — el
  # issuer local letsencrypt-default (selfSigned) puebla esos Secrets.
  - target:
      kind: Ingress
      name: argocd
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: argocd.localhost
      - op: replace
        path: /spec/tls/0/hosts/0
        value: argocd.localhost
  - target:
      kind: Ingress
      name: grafana
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: grafana.localhost
      - op: replace
        path: /spec/tls/0/hosts/0
        value: grafana.localhost
  - target:
      kind: Ingress
      name: auth
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: auth.localhost
      - op: replace
        path: /spec/tls/0/hosts/0
        value: auth.localhost

  # ---- Label env por ambiente (fix 27) ------------------------------------
  # La base ya NO hardcodea env: production: cada overlay firma el valor REAL
  # del ambiente en los labels del template del Pod (los ServiceMonitors lo
  # relabelan desde el Pod, __meta_kubernetes_pod_label_env) y en el
  # Namespace ecommerce.
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=ecommerce-platform
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/env
        value: local
  - target:
      kind: Namespace
      name: ecommerce
    patch: |-
      - op: add
        path: /metadata/labels/env
        value: local

  # ── Fase 6: services con datasource → Postgres sidecar EN EL POD ──────
  # Fix 30: se reemplaza el postgres del emulador (host.docker.internal con
  # puerto DINAMICO, DB compartida `ecommerce`) por un sidecar postgres:16-
  # alpine por pod (127.0.0.1:5432, DB PROPIA por servicio) — misma versión
  # mayor que Azure (postgres_version=16) y comportamiento local == Azure.
  # Los env SPRING_DATASOURCE_* del contenedor tienen precedencia sobre el
  # envFrom del CM (el base ya no lleva jdbc:h2); credenciales desde el
  # Secret db-credentials (placeholder local). ddl-auto=update crea el schema
  # y ENABLE_MOCK_DATA=true re-siembra los datos demo.
  - target:
      kind: Deployment
      name: catalog-svc
    path: patches/catalog-svc-postgres-sidecar.yaml
  - target:
      kind: Deployment
      name: order-svc
    path: patches/order-svc-postgres-sidecar.yaml
  - target:
      kind: Deployment
      name: payment-svc
    path: patches/payment-svc-postgres-sidecar.yaml
  - target:
      kind: Deployment
      name: inventory-svc
    path: patches/inventory-svc-postgres-sidecar.yaml

  # â”€â”€ Ingresos local: hosts *.localhost â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # El base deja el placeholder api.<domain> (lo resuelve el CD en Azure);
  # en local los hosts son subdominios de .localhost (RFC 1123, sin DNS).
  - target:
      kind: Ingress
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.localhost
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.localhost
  - target:
      kind: Ingress
      name: auth
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: auth.localhost
      - op: replace
        path: /spec/tls/0/hosts/0
        value: auth.localhost
  - target:
      kind: Ingress
      name: frontend
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: www.localhost
      - op: replace
        path: /spec/tls/0/hosts/0
        value: www.localhost

  # â”€â”€ Excluidos del base (local) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Argo CD Applications: en local el bootstrap aplica componentes directo.
  - target:
      kind: Application
      group: argoproj.io
      version: v1alpha1
      name: ecommerce-apps
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: ecommerce-apps
      $patch: delete
  - target:
      kind: Application
      group: argoproj.io
      version: v1alpha1
      name: external-dns
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: external-dns
      $patch: delete
  - target:
      kind: Application
      group: argoproj.io
      version: v1alpha1
      name: ecommerce-dev
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: ecommerce-dev
      $patch: delete
  - target:
      kind: Application
      group: argoproj.io
      version: v1alpha1
      name: ecommerce-staging
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: ecommerce-staging
      $patch: delete
  - target:
      kind: Application
      group: argoproj.io
      version: v1alpha1
      name: ecommerce-prod
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: ecommerce-prod
      $patch: delete

  # external-dns (DNS de Azure â€” no aplica en local)
  - target:
      kind: ServiceAccount
      name: external-dns
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: external-dns
      $patch: delete
  - target:
      kind: ClusterRole
      name: external-dns
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: external-dns
      $patch: delete
  - target:
      kind: ClusterRoleBinding
      name: external-dns-viewer
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: external-dns-viewer
      $patch: delete
  - target:
      kind: Secret
      name: azure-config-file
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: azure-config-file
      $patch: delete
  - target:
      kind: Deployment
      name: external-dns
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: external-dns
      $patch: delete

  # example-external-secret (requiere el Key Vault real)
  - target:
      kind: ExternalSecret
      group: external-secrets.io
      version: v1beta1
      name: ecommerce-db-credentials
    patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: ecommerce-db-credentials
      $patch: delete

# ── Phase 4: GITOPS TOTAL — los operadores viven EN Argo CD ─────────────────────────────────
# ingress-nginx, cert-manager, external-secrets, kyverno, keda y
# kube-prometheus-stack se instalan via sus Applications (importadas del base,
# ver header). Quedan excluidos SOLO los recursos que dependen de Azure o de
# secrets reales: ClusterIssuers ACME (letsencrypt-*), ClusterSecretStore
# azure-keyvault, ExternalSecrets y el ScaledObject order-worker.
# NOTA: los deletes kind-wide (SM sin nombre) FALLAN en kustomize v5
# ("no matches for Id"/"trouble configuring PatchTransformer"), por eso la
# exclusion es POR NOMBRE, consistente con el resto del overlay.

  # cert-manager: se eliminan SOLO los issuers ACME (letsencrypt-*); local = selfSigned
  - target:
      kind: ClusterIssuer
      group: cert-manager.io
      version: v1
      name: letsencrypt-staging
    patch: |-
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-staging
      $patch: delete
  - target:
      kind: ClusterIssuer
      group: cert-manager.io
      version: v1
      name: letsencrypt-prod
    patch: |-
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-prod
      $patch: delete

  # kyverno: TODAS las ClusterPolicies se importan (paridad con Azure);
  # disallow-plain-secrets queda en Audit (no bloquea los secrets placeholder).
  # external-secrets: se excluyen el ClusterSecretStore azure-keyvault y los
  # ExternalSecrets (local usa Secrets placeholder); el operador corre igual.
  - target:
      kind: ClusterSecretStore
      group: external-secrets.io
      version: v1beta1
      name: azure-keyvault
    patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: ClusterSecretStore
      metadata:
        name: azure-keyvault
      $patch: delete
  - target:
      kind: ExternalSecret
      group: external-secrets.io
      version: v1beta1
      name: keycloak-admin-credentials
    patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: keycloak-admin-credentials
      $patch: delete

  - target:
      kind: ExternalSecret
      group: external-secrets.io
      version: v1beta1
      name: grafana-admin-credentials
    patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: grafana-admin-credentials
      $patch: delete

  # Fase 5: el ExternalSecret event-hubs-credentials (nuevo en el base para
  # Event Hubs SASL) no aplica en local — no hay Event Hubs, el Kafka local
  # usa PLAINTEXT y los patches SASL solo existen en overlays Azure.
  - target:
      kind: ExternalSecret
      group: external-secrets.io
      version: v1beta1
      name: event-hubs-credentials
    patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: event-hubs-credentials
      $patch: delete

  # Fase 6: el ExternalSecret db-credentials (nuevo en el base para el
  # datasource Postgres + Keycloak Azure) no aplica en local — el Secret
  # placeholder db-credentials corre plano.
  - target:
      kind: ExternalSecret
      group: external-secrets.io
      version: v1beta1
      name: db-credentials
    patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: db-credentials
      $patch: delete

  # KEDA: se excluye SOLO el ScaledObject order-worker (placeholder de Event Hubs
  # + envs $EVENT_HUBS_SASL_* inexistentes); el operador corre igual.
  - target:
      kind: ScaledObject
      group: keda.sh
      version: v1alpha1
      name: order-worker
    patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: order-worker
      $patch: delete

  # Exclusión de HPA revertida (Phase 4): los 18 HPA del base se importan.
  # k3s incluye metrics-server por defecto; el autoscaler ya no satura el
  # nodo único (ver docs/fixes/28-uis-ingress-tls-sso-gitops-floci.md).
components:
  - ../../../security/pod-security

# â”€â”€ Image tags â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Registry local = sidecar ACR de floci. Los contenedores k3s acceden al
# host via host.docker.internal (plan-implementacion 4.1).
# El tag por default es <sha> â€” lo pisa el deploy o el script build-push.
images:
  - name: acr.azurecr.io/config-service
    newName: host.docker.internal:5000/localecommercefloci01/config-service
    newTag: 870f34f
  - name: acr.azurecr.io/discovery-service
    newName: host.docker.internal:5000/localecommercefloci01/discovery-service
    newTag: 870f34f
  - name: acr.azurecr.io/api-gateway
    newName: host.docker.internal:5000/localecommercefloci01/api-gateway
    newTag: 870f34f
  - name: acr.azurecr.io/auth
    newName: host.docker.internal:5000/localecommercefloci01/auth
    newTag: 870f34f
  - name: acr.azurecr.io/catalog-svc
    newName: host.docker.internal:5000/localecommercefloci01/catalog-svc
    newTag: 870f34f
  - name: acr.azurecr.io/cart-svc
    newName: host.docker.internal:5000/localecommercefloci01/cart-svc
    # Tag privado de cart-svc: serialización de Cart.total() (fix 20). El resto
    # de los servicios siguen en 870f34f; bump necesario por IfNotPresent.
    newTag: 870f35b
  - name: acr.azurecr.io/checkout-svc
    newName: host.docker.internal:5000/localecommercefloci01/checkout-svc
    # Tag privado de checkout-svc: productor Kafka (fix 19). El resto de los
    # servicios siguen en 870f34f; el bump es necesario porque imagePullPolicy
    # es IfNotPresent y un rebuild con el MISMO tag deja pods viejos.
    newTag: 870f35a
  - name: acr.azurecr.io/order-svc
    newName: host.docker.internal:5000/localecommercefloci01/order-svc
    newTag: 870f34f
  - name: acr.azurecr.io/payment-svc
    newName: host.docker.internal:5000/localecommercefloci01/payment-svc
    newTag: 870f34f
  - name: acr.azurecr.io/notification-svc
    newName: host.docker.internal:5000/localecommercefloci01/notification-svc
    newTag: 870f34f
  - name: acr.azurecr.io/search-svc
    newName: host.docker.internal:5000/localecommercefloci01/search-svc
    newTag: 870f34f
  - name: acr.azurecr.io/recommendation-svc
    newName: host.docker.internal:5000/localecommercefloci01/recommendation-svc
    newTag: 870f34f
  - name: acr.azurecr.io/inventory-svc
    newName: host.docker.internal:5000/localecommercefloci01/inventory-svc
    newTag: 870f34f
  - name: acr.azurecr.io/shipping-svc
    newName: host.docker.internal:5000/localecommercefloci01/shipping-svc
    newTag: 870f34f
  - name: acr.azurecr.io/returns-svc
    newName: host.docker.internal:5000/localecommercefloci01/returns-svc
    newTag: 870f34f
  - name: acr.azurecr.io/analytics-svc
    newName: host.docker.internal:5000/localecommercefloci01/analytics-svc
    newTag: 870f34f
  - name: acr.azurecr.io/bff-web
    newName: host.docker.internal:5000/localecommercefloci01/bff-web
    newTag: 870f34f
  - name: acr.azurecr.io/frontend
    newName: host.docker.internal:5000/localecommercefloci01/frontend
    newTag: 870f34f
