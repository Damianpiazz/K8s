                  - name: SPRING_DATASOURCE_PASSWORD
                    value: <fuerte-sin-@>
                  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
                    value: update

  # â”€â”€ Ingresos local: hosts *.localhost â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # El base deja el placeholder api.<domain> (lo resuelve el CD en Azure);
  # en local los hosts son subdominios de .localhost (RFC 1123, sin DNS).
  - target:
      kind: Ingress
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.localhost
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.localhost
  - target:
      kind: Ingress
      name: auth
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: auth.localhost
      - op: replace
        path: /spec/tls/0/hosts/0
        value: auth.localhost
  - target:
      kind: Ingress
      name: frontend
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: www.localhost
      - op: replace
        path: /spec/tls/0/hosts/0
        value: www.localhost

