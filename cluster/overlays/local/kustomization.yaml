# â”€â”€ Operators ausentes en local: exclusiÃ³n kind-wide (kustomize v5) â”€â”€â”€â”€â”€
# Estos recursos pertenecen a CRDs de operators (cert-manager, kyverno,
# external-secrets, kube-prometheus-stack, KEDA) que el app-of-apps de Argo
# instala en Azure pero NO en el bootstrap local. Sin las CRDs el apply
# falla ("no matches for kind"), asÃ­ que se barren del build completo.
# R4 (ESO <-> Key Vault emulado) queda PENDIENTE: local usa Secrets planos.
# NOTA: los deletes kind-wide (SM sin nombre) FALLAN en kustomize v5
# ("no matches for Id"/"trouble configuring PatchTransformer"), por eso la
# exclusiÃ³n es POR NOMBRE, consistente con el resto del overlay.

  # â”€â”€ ExclusiÃ³n por nombre: cert-manager (CRDs ausentes en local) â”€â”€â”€â”€â”€â”€â”€â”€â”€
