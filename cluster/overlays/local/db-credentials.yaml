---
# Fase 6 — Secret `db-credentials` local (placeholder plano).
#
# En Azure lo materializa el ExternalSecret db-credentials (cluster/base) →
# Key Vault; local no tiene Key Vault, así que este Secret corre plano con
# credenciales DEMO de desarrollo (solo floci, nunca un cluster real).
# Lo consumen: los sidecars postgres:16-alpine (POSTGRES_USER/PASSWORD) y el
# datasource de los 4 servicios (SPRING_DATASOURCE_USERNAME/PASSWORD).
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
type: Opaque
stringData:
  username: ecommerce_local
  password: ecommerce_local_demo_pw