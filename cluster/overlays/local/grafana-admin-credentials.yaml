---
# Secret placeholder LOCAL (fix 27): el Grafana del stack local lee la clave
# `admin-password` del Secret `grafana-admin-credentials` (values.yaml →
# grafana.admin.existingSecret).
#
# En Azure (dev/staging/prod) ese Secret lo materializa el ExternalSecret
# `grafana-admin-credentials` desde el Key Vault (cluster/base/external-secrets/
# grafana-admin-credentials.yaml). En local no hay Key Vault, así que este
# placeholder permite el login admin/admin en el Grafana local (el default del
# chart). NUNCA commitees credenciales reales acá — Fase 5 reemplaza este
# mecanismo por la KV emulada cuando exista.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
type: Opaque
stringData:
  admin-password: admin