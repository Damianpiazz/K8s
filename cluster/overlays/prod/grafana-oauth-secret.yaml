---
# Grafana OAuth client secret — PROD (Fase 5).
#
# Materialises the Secret `grafana-oauth-credentials` in the observability
# namespace from Key Vault. The grafana pod reads it via the chart's
# envValueFrom (cluster/base/monitoring/kube-prometheus-stack/values.yaml →
# GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET). The overlay ConfigMap
# (grafana-oauth-config.yaml) no longer carries the secret.
#
# Must match the Keycloak client `grafana` secret in the realm deployed by
# this overlay (auth-realm-configmap.yaml) and Key Vault `grafana-oauth-client-secret`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-oauth-credentials
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: grafana-oauth-credentials
    creationPolicy: Owner
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        key: grafana-oauth-client-secret