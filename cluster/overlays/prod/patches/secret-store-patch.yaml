---
# Patch: ClusterSecretStore vault URL for PRODUCTION.
#
# Strategic merge patch — matches the resource name "azure-keyvault" from
# cluster/base/external-secrets/cluster-secret-store.yaml.
#
# Replace the vault name with your actual terraform output:
#   terraform -chdir=infra/terraform output -raw keyvault_name
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azure:
      vaultUrl: https://kv-prod-ecommerce.vault.azure.net # REPLACE with terraform output
