---
# Patch: SASL/Event Hubs credentials para el productor Kafka de checkout-svc
# (PROD, Fase 5).
#
# Las credenciales vienen del Secret `event-hubs-credentials` (ExternalSecret
# del base → Key Vault): username = "$ConnectionString", password = connection
# string del namespace.
#
# - EVENT_HUBS_SASL_USERNAME/PASSWORD: consumidos por el propio Spring
#   (placeholder ${} en la JAAS config) y por KEDA ($VAR del ScaledObject).
# - SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: relaxed binding →
#   spring.kafka.properties.sasl.jaas.config; Spring Boot resuelve los ${...}
#   contra las env vars del pod.
# - KAFKA_SECURITY_PROTOCOL=SASL_SSL viene del ecommerce-env-config (Azure).
#
# Este patch existe SOLO en overlays Azure — local usa PLAINTEXT (sin SASL).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-svc
spec:
  template:
    spec:
      containers:
        - name: checkout-svc
          env:
            - name: EVENT_HUBS_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: event-hubs-credentials
                  key: sasl-username
            - name: EVENT_HUBS_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: event-hubs-credentials
                  key: sasl-password
            - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
              value: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${EVENT_HUBS_SASL_USERNAME}" password="${EVENT_HUBS_SASL_PASSWORD}";'
            - name: SPRING_KAFKA_PROPERTIES_SASL_MECHANISM
              value: PLAIN