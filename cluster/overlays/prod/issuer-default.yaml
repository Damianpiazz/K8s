---
# ClusterIssuer: letsencrypt-default (PRODUCTION → production ACME).
#
# This is the REAL Let's Encrypt issuer — certificates are publicly trusted.
# Only use this once cert-manager, ingress-nginx, and external-dns are
# fully operational. Hitting the production ACME server with broken configs
# will burn rate limits.
#
# Services reference this issuer via the annotation:
#   cert-manager.io/cluster-issuer: letsencrypt-default
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-default
spec:
  acme:
    # Production ACME — real, trusted certificates
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@ecommerce.com # REPLACE with your email
    privateKeySecretRef:
      name: letsencrypt-default-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
