---
# OIDC client secret for Argo CD — PROD (Fase 5).
#
# Referenced by argocd-cm via clientSecret: $oidc-argocd:clientSecret.
# The value MUST match the Keycloak client `argocd` secret in the realm
# deployed by this overlay (auth-realm-configmap.yaml, client.secret) and the
# Key Vault secret `argocd-oidc-client-secret` (seeded by terraform, default =
# the same placeholder → the chain works out of the box; rotation = change the
# terraform variable + the realm).
#
# ExternalSecret → Key Vault (ClusterSecretStore azure-keyvault) → Secret
# oidc-argocd (creationPolicy: Owner). The local overlay ships a placeholder
# Secret with this same name instead.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oidc-argocd
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: oidc-argocd
    creationPolicy: Owner
  data:
    - secretKey: clientSecret
      remoteRef:
        key: argocd-oidc-client-secret