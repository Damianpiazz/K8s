---
# Argo CD RBAC — Keycloak groups (Phase 4). Merges over the bootstrap's empty
# argocd-rbac-cm. The `groups` claim comes from the client-level Group
# Membership mapper on the Keycloak client `argocd` (realm-export.json) — flat
# path, so the claim value is exactly `ecommerce-admins`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.csv: |
    g, ecommerce-admins, role:admin