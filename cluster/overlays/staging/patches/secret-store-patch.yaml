---
# Patch: ClusterSecretStore → Key Vault STAGING (Fase 5).
#
# Strategic merge patch sobre cluster/base/external-secrets/
# cluster-secret-store.yaml (nombre "azure-keyvault").
#
# Valores con los outputs de terraform (los <...> se sustituyen una vez por
# entorno, post-apply):
#   terraform -chdir=infra/terraform/envs/staging output keyvault_vault_url
#   terraform -chdir=infra/terraform/envs/staging output keyvault_tenant_id
#   terraform -chdir=infra/terraform/envs/staging output eso_identity_client_id
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azure:
      tenantId: <terraform-output-keyvault-tenant-id> # REPLACE con keyvault_tenant_id
      vaultUrl: https://kv-staging-ecommerce-tppractico01.vault.azure.net # REPLACE con keyvault_vault_url
      authType: ManagedIdentity
      identityId: <terraform-output-eso-identity-client-id> # REPLACE con eso_identity_client_id