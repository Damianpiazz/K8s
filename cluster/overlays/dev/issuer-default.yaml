---
# ClusterIssuer: letsencrypt-default (DEV → staging ACME).
#
# Dev uses the Let's Encrypt staging server to avoid rate limits while testing
# cert-manager. The staging issuer issues certificates signed by an untrusted
# CA — browsers will show a warning, which is expected in dev.
#
# Services reference this issuer via the annotation:
#   cert-manager.io/cluster-issuer: letsencrypt-default
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-default
spec:
  acme:
    # Staging ACME — high rate limits, untrusted certificates (safe for dev)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@ecommerce.dev # REPLACE with your email
    privateKeySecretRef:
      name: letsencrypt-default-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
