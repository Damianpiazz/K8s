---
# Grafana generic OAuth (Keycloak) — Phase 4. Read by the Grafana subchart via
# `grafana.envFromConfigMaps` (values.yaml) and injected as env vars into the
# grafana pod, so any GF_* setting can be layered per environment here without
# touching the shared chart values.
#
# URL strategy:
#   - AUTH_URL (browser redirect) → public https://auth.<zone> (dev zone:
#     auth.dev.ecommerce.example.com).
#   - TOKEN_URL / API_URL (server-to-server) → in-cluster
#     http://auth.ecommerce.svc.cluster.local:8080 — no TLS, no DNS, no
#     hostAliases needed on the grafana pod.
#
# Role mapping: ecommerce-admins → Grafana Admin, everyone else → Viewer
# (Grafana default when the expression yields no role).
#
# Fase 5: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET ya NO vive en este ConfigMap —
# se inyecta desde el Secret grafana-oauth-credentials (ExternalSecret →
# Key Vault) via grafana.envValueFrom en values.yaml del stack.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-oauth-config
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
data:
  GF_SERVER_ROOT_URL: https://grafana.dev.ecommerce.example.com
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
  GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "false"
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
  GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.dev.ecommerce.example.com/realms/ecommerce/protocol/openid-connect/auth
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://auth.ecommerce.svc.cluster.local:8080/realms/ecommerce/protocol/openid-connect/token
  GF_AUTH_GENERIC_OAUTH_API_URL: http://auth.ecommerce.svc.cluster.local:8080/realms/ecommerce/protocol/openid-connect/userinfo
  GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], 'ecommerce-admins') && 'Admin'